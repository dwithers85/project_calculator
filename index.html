<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src = "script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Dan's Calculator</h1>
  <input class="input-field">  
  <div id="button-container">
    <div id="digit-container">
        <div class="button-row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
        </div>
        <div class="button-row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
        </div>
        <div class="button-row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
        </div>
        <div class="button-row">
            <button>0</button>
            <button>.</button>
            <button>=</button>
        </div>
    </div>
    <div id="operand-container">
        <button>/</button>
        <button>x</button>
        <button>-</button>
        <button>+</button>
        <button>CLR</button>
    </div>
  </div>
</body>
</html>
